server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas exposer la version de Nginx.
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # Ne fuite pas l'URL complète en référent.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Réduit les permissions du navigateur.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # `connect-src` doit lister le domaine de l'API, sinon le navigateur bloque
    # tous les appels du front vers l'API. Adaptez le domaine si besoin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.baguette-league.eu; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Handle Vue Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
