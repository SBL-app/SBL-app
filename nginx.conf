server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Ne pas exposer la version de Nginx.
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;

    # Security headers (voir security-headers.conf pour le détail)
    include /etc/nginx/snippets/security-headers.conf;

    # Handle Vue Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # robots.txt et sitemap : servis depuis les fichiers statiques du build,
    # sans passer par le fallback SPA (qui renverrait index.html et donc un
    # document HTML là où un robot attend du texte).
    location = /robots.txt {
        access_log off;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        access_log off;
        try_files $uri =404;
    }

    # Health check
    location /health {
        default_type text/plain;
        return 200 'OK';
    }
}
