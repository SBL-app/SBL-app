server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- En-têtes de sécurité (OWASP A05 — Security Misconfiguration) ----
    # Empêche le MIME-sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    # Anti-clickjacking.
    add_header X-Frame-Options "DENY" always;
    # Ne fuite pas l'URL complète en référent.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Réduit les permissions du navigateur.
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Politique de sécurité du contenu (CSP) — protège contre le XSS (A03).
    # `connect-src` autorise les appels vers l'API. Adaptez le domaine si besoin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://sbl-api.alexandre-giordana.fr; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Cache long pour les assets versionnés par Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Fallback SPA : toutes les routes retombent sur index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ne pas exposer la version de Nginx.
    server_tokens off;
}
