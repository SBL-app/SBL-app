name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint, tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint (ESLint + accessibilité)
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Build production
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: ignore

  security:
    name: Audit dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # OWASP A06 — composants vulnérables. Ciblé sur les dépendances de
      # PRODUCTION (les vulns de l'outillage de dev n'affectent pas le runtime).
      - name: npm audit (production, high)
        run: npm audit --omit=dev --audit-level=high
