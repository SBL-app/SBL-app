name: CD

# Déploiement continu du frontend : sur push sur main, synchronisation du code
# vers le sous-dossier `SBL-app/` de la stack sur le serveur, puis rebuild du
# service `frontend` (build Vite dans l'image Docker) via docker compose.
#
# Secrets requis :
#   SSH_HOST, SSH_USER, SSH_KEY, SSH_PORT (optionnel, défaut 22), DEPLOY_PATH

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend over SSH
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT || '22' }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync frontend source
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'dist' \
            --exclude 'coverage' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT || '22' }}" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/SBL-app/"

      # Quatre dépôts pilotent le même projet docker compose sur le même
      # serveur. Un `up` concurrent recrée des conteneurs sous les pieds de
      # l'autre, et `image prune -f` peut emporter les couches intermédiaires
      # d'un build en cours. La clé `concurrency:` ci-dessus ne protège que de
      # ce dépôt : ses groupes sont propres à un dépôt et ne se voient pas
      # entre eux. D'où un verrou côté serveur, partagé avec `infrastructure`,
      # `api` et `bot`.
      - name: Rebuild & restart service
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.SSH_PORT || '22' }}" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}' bash -s" <<'REMOTE'
          set -euo pipefail

          exec 9>/tmp/sbl-deploy.lock
          if ! flock -w 300 9; then
            echo "::error::verrou de déploiement non obtenu après 300 s : un autre déploiement est en cours"
            exit 1
          fi

          cd "$DEPLOY_PATH"
          docker compose up -d --build frontend
          docker image prune -f
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
