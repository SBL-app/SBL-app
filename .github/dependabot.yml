version: 2

# Processus de mise à jour des dépendances — Frontend Vue 3 (C4.1.1)
#
# Périmètre  : dépendances npm, image Docker de build, actions CI.
# Fréquence  : hebdomadaire le lundi.
# Mode       : automatique pour la détection, manuel pour la validation.

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels:
      - "type:deps"
      - "composant:front"
    commit-message:
      prefix: "deps"
      prefix-development: "chore"
      include: scope
    groups:
      # L'écosystème Vue est fortement couplé (runtime, router, store) :
      # une mise à jour partielle produit des incompatibilités de types.
      vue:
        patterns:
          - "vue"
          - "vue-*"
          - "@vue/*"
          - "pinia"
        update-types:
          - minor
          - patch
      build:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vite-plugin-*"
        update-types:
          - minor
          - patch
      dev-tools:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels:
      - "type:deps"
      - "composant:infra"
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - "type:deps"
      - "composant:infra"
    commit-message:
      prefix: "ci"
